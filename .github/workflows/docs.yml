name: Publish curated documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Validate knowledge contract
        run: bin/build-knowledge --check
      - name: Assemble allowlisted documentation source
        run: bin/build-docs --write
      - name: Build static site
        env:
          PRODUCT_OS_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PRODUCT_OS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PRODUCT_OS_REPOSITORY_NAME: ${{ github.repository }}
        run: python -m mkdocs build --strict --config-file mkdocs.yml
      - name: Verify static artifact boundary
        run: |
          for excluded in templates memory tests docs bin .github registry.tsv knowledge/catalog.yml; do
            test ! -e ".product-os-site/$excluded" || {
              echo "Excluded material reached the Pages artifact: $excluded" >&2
              exit 1
            }
          done
      - name: Upload curated Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .product-os-site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
