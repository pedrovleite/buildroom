site_name: Buildroom
site_description: A file-first operating system for approved, verified product work.
site_url: !ENV [BUILDROOM_SITE_URL, http://localhost:8000/]
repo_url: !ENV [BUILDROOM_REPOSITORY_URL, https://example.invalid/buildroom]
repo_name: !ENV [BUILDROOM_REPOSITORY_NAME, local/buildroom]
docs_dir: .buildroom-docs
site_dir: .buildroom-site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences

nav:
  - Start here:
      - Overview: index.md
      - Operating model: operating-model.md
      - Run operations: run-operations.md
  - Discovery:
      - Knowledge contract: knowledge/README.md
      - Catalog: knowledge/catalog.md
      - Taxonomy: knowledge/taxonomy.md
  - Roles:
      - Researcher: agents/researcher.md
      - Product Manager: agents/product-manager.md
      - Architect: agents/architect.md
      - Engineer: agents/engineer.md
      - QA Reviewer: agents/qa-reviewer.md
  - Workflows:
      - Research to PRD: workflows/research-to-prd.md
      - PRD to Technical Spec: workflows/prd-to-tech-spec.md
      - Feature Delivery: workflows/feature-delivery.md
      - Bug Fix: workflows/bug-fix.md
      - No-Bullshit Bug Fix: workflows/no-bullshit-bug-fix.md
  - Context packs:
      - Research to PRD: knowledge/context/research-to-prd.md
      - PRD to Technical Spec: knowledge/context/prd-to-tech-spec.md
      - Feature Delivery: knowledge/context/feature-delivery.md
      - Bug Fix: knowledge/context/bug-fix.md
      - No-Bullshit Bug Fix: knowledge/context/no-bullshit-bug-fix.md
